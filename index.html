    <!--
      Everything between social:start and social:end is replaced per route by
      scripts/prerender.mjs, which builds it from src/siteMeta.js. What is here
      is the home-page version: it is what the dev server shows, and what any
      route that escaped prerendering would fall back to.

      Do not hand-edit these values — change src/siteMeta.js and rebuild, or the
      prerendered pages and this block will disagree.
    -->
    <!-- social:start -->
    <title>Call Center Village — Voice Security Training</title>
    <meta name="description" content="Free, hands-on training in voice security: AI voice cloning, voice agent architecture and attack surface, and social engineering against humans and AI agents." />

    <meta property="og:image:alt" content="Call Center Village — voice security training" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X. No twitter:site or twitter:creator: there is no X account,
         and a handle that resolves to nothing is worse than an absent one. -->

    <meta name="twitter:title" content="Call Center Village — Voice Security Training" />

    <meta name="twitter:image:alt" content="Call Center Village — voice security training" />

    <!-- Above-the-fold weights only; the rest are discovered from the CSS below. -->
    <link rel="preload" href="/fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-600.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      /* Subset to Latin + the symbol blocks actually used in the UI. Regenerate
         with scripts/build-fonts.py if a new glyph range is ever needed. */
      @font-face { font-family: 'Inter'; font-weight: 400; font-style: normal; font-display: swap; src: url('/fonts/inter-400.woff2') format('woff2'); }
      @font-face { font-family: 'Inter'; font-weight: 500; font-style: normal; font-display: swap; src: url('/fonts/inter-500.woff2') format('woff2'); }
      @font-face { font-family: 'Inter'; font-weight: 600; font-style: normal; font-display: swap; src: url('/fonts/inter-600.woff2') format('woff2'); }
      @font-face { font-family: 'Inter'; font-weight: 700; font-style: normal; font-display: swap; src: url('/fonts/inter-700.woff2') format('woff2'); }
      @font-face { font-family: 'Inter'; font-weight: 800; font-style: normal; font-display: swap; src: url('/fonts/inter-800.woff2') format('woff2'); }
      @font-face { font-family: 'JetBrains Mono'; font-weight: 400; font-style: normal; font-display: swap; src: url('/fonts/jetbrains-mono-400.woff2') format('woff2'); }
      @font-face { font-family: 'JetBrains Mono'; font-weight: 600; font-style: normal; font-display: swap; src: url('/fonts/jetbrains-mono-600.woff2') format('woff2'); }
      *, *::before, *::after { box-sizing: border-box; }
      html, body, #root { margin: 0; padding: 0; background: #08060f; }
      body { font-family: 'Inter', 'Segoe UI', sans-serif; }
      button { font-family: 'Inter', 'Segoe UI', sans-serif; }
      body { font-size: 16px; }
      /* Long URLs and paths in prose break instead of forcing a horizontal scroll. */
      body { overflow-wrap: break-word; }
      *:focus-visible {
        outline: 2px solid #38b6ff;
        outline-offset: 2px;
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>

    <div id="root"></div>

  </body>
